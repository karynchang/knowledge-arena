</style><script async src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><header><b>✦ 知識競技場 · 題庫管理測試 V5.0</b></header><main id="app">載入題庫中…</main><script>try{
const KEY='arena-banks-v3';
const types=['單選題','是非題','排序題','圖片辨識題'];
const letters='ABCD';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeImage(s){if(!s)return '';if(/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(s))return s;try{let u=new URL(s,location.href);return (['http:','https:'].includes(u.protocol)||(location.protocol==='file:'&&u.protocol==='file:'&&!/^[a-z][a-z0-9+.-]*:/i.test(s)&&!s.startsWith('//')))?u.href:''}catch{return ''}}
function validate(q){if(!types.includes(q.type)||!q.question.trim()||q.options.length<2||q.options.length>4||q.options.some(x=>!x.trim())||q.correct.length!==(q.type==='排序題'?q.options.length:1)||new Set(q.correct).size!==q.correct.length||q.correct.some(x=>!Number.isInteger(x)||x<0||x>=q.options.length)||!Number.isInteger(q.seconds)||q.seconds<5||q.seconds>180|| (q.image&&!safeImage(q.image))||(q.type==='圖片辨識題'&&!q.image))throw Error('請檢查題目、連續選項、答案、圖片與 5～180 秒作答時間');return q}

function mountEditor(root,{demo,importBank,exportX,template,onCreate}){
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let bank=[],name='',selected='',active=false,drag=-1;
const $=s=>root.querySelector(s);const warn=e=>alert(e.message||e);const act=(id,fn)=>{$('#'+id).onclick=()=>Promise.resolve().then(fn).catch(warn)};
function draw(){root.innerHTML=`<div class="editor-heading"><div class="mascot happy" aria-hidden="true"><i></i></div><div><h1>題庫管理</h1><p class="muted">選擇題庫，或建立自己的知識挑戰！</p></div></div><div class="panel"><label>活動／題庫名稱<input id="bankname" placeholder="請輸入活動／題庫名稱" value="${esc(name)}"></label><div class="tools"><button id="save">儲存題庫</button><button id="newbank">空白題庫</button><button id="demo">載入示範</button></div><label>已儲存題庫<select id="saved"><option value="">選擇題庫</option>${Object.keys(saved).map(k=>`<option value="${esc(k)}" ${selected===k?'selected':''}>${esc(k)}</option>`).join('')}</select></label><div class="tools"><button id="load">開啟</button><button id="deletebank">刪除已儲存題庫</button></div><p class="muted">題庫儲存在目前瀏覽器，請定期匯出備份。</p></div><div class="panel"><div class="tools"><button id="add">＋ 新增題目</button><button id="template">Excel 範本</button><button id="exportbank">匯出 Excel</button><button type="button" id="importExcel">匯入 Excel</button><input id="file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden></div><div ${active?'':'hidden'}><p>共 ${bank.length} 題 / 100 題 · 可拖曳或使用上下箭頭排序</p><div id="qlist">${bank.map((q,i)=>`<article class="qrow" draggable="true" data-i="${i}"><div><small>☰ ${i+1} · ${esc(q.type)} · ${q.seconds} 秒</small><strong>${esc(q.question)}</strong></div><div class="tools"><button data-act="edit" data-i="${i}">編輯</button><button data-act="preview" data-i="${i}">預覽</button><button data-act="copy" data-i="${i}">複製</button><button data-act="up" data-i="${i}" ${i===0?'disabled':''}>↑</button><button data-act="down" data-i="${i}" ${i===bank.length-1?'disabled':''}>↓</button><button data-act="delete" data-i="${i}">刪除</button></div></article>`).join('')||'<p>尚無題目</p>'}</div><button id="create" ${bank.length?'':'disabled'}>建立競賽房間</button></div>${active?'':'<div class="empty-state">請先選擇已儲存題庫，或新增題目、匯入 Excel 建立新題庫。</div>'}</div><dialog id="editdialog"></dialog>`;
$('#bankname').oninput=e=>name=e.target.value;act('save',()=>{let k=name.trim();if(!k)throw Error('請輸入題庫名稱');if(Object.hasOwn(saved,k)&&!confirm('覆蓋同名題庫？'))return;const next={...saved,[k]:structuredClone(bank)};localStorage.setItem(KEY,JSON.stringify(next));saved=next;selected=k;active=true;draw();alert('題庫已儲存')});function loadSelected(){const k=$('#saved').value;if(k===selected&&active)return;if(active&&bank.length&&!confirm('切換題庫將取代目前編輯內容，確定？')){$('#saved').value=selected;return}selected=k;name=k;bank=k?structuredClone(saved[k]):[];active=!!k;draw()}$('#saved').onchange=loadSelected;act('load',loadSelected);act('deletebank',()=>{const k=$('#saved').value;if(k&&confirm('刪除此已儲存題庫？')){const next={...saved};delete next[k];localStorage.setItem(KEY,JSON.stringify(next));saved=next;if(selected===k){selected='';name='';bank=[];active=false}draw()}});act('newbank',()=>{if(confirm('清空目前編輯內容？')){bank=[];name='';selected='';active=true;draw()}});act('demo',()=>{if(confirm('以示範題取代目前內容？')){bank=structuredClone(demo);selected='';active=true;draw()}});act('add',()=>{if(bank.length>=100)throw Error('最多 100 題');edit(-1)});act('template',template);act('exportbank',()=>{if(!bank.length)throw Error('沒有題目');if(bank.some(q=>(q.image||'').length>32767))throw Error('上傳圖片超過 Excel 儲存格長度；請使用 JSON 備份或改用圖片網址。');exportX(rows(bank),name+'.xlsx')});act('create',()=>{bank.forEach(validate);return onCreate(name.trim()||'知識競技場',structuredClone(bank))});$('#importExcel').onclick=()=>{const f=$('#file');f.value='';f.click()};$('#file').onchange=async e=>{try{if(!e.target.files[0])return;if(!window.XLSX)throw Error('Excel 元件尚未載入，請確認網路後重新整理。');const w=XLSX.read(await e.target.files[0].arrayBuffer());const b=importBank(XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''}));if(!b.length||b.length>100)throw Error('題庫須有 1～100 題');b.forEach(validate);if(confirm('匯入將取代目前題庫，確定？')){bank=b;selected='';active=true;draw()}}catch(e){warn(e)}finally{e.target.value=''}};
const backup=document.createElement('button');backup.textContent='JSON 備份';backup.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({name,bank})],{type:'application/json'}));a.download=name+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#exportbank').after(backup);const restore=document.createElement('input');restore.type='file';restore.accept='.json';restore.style.display='none';restore.onchange=async()=>{try{const b=JSON.parse(await restore.files[0].text());if(!Array.isArray(b.bank)||b.bank.length>100)throw Error('備份格式錯誤');b.bank.forEach(validate);if(confirm('還原將取代目前內容，確定？')){bank=b.bank;name=String(b.name||'');selected='';active=true;draw()}}catch(e){warn(e)}};const rb=document.createElement('button');rb.textContent='還原 JSON';rb.onclick=()=>restore.click();backup.after(rb,restore);
root.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>{try{let i=+el.dataset.i;switch(el.dataset.act){case 'edit':return edit(i);case 'preview':return preview(bank[i]);case 'copy':if(bank.length>=100)throw Error('最多 100 題');bank.splice(i+1,0,structuredClone(bank[i]));break;case 'delete':if(confirm('刪除這道題？'))bank.splice(i,1);break;case 'up':move(i,i-1);return;case 'down':move(i,i+1);return;}draw()}catch(e){warn(e)}});root.querySelectorAll('.qrow').forEach(el=>{el.ondragstart=e=>{drag=+el.dataset.i;e.dataTransfer.setData('text/plain',String(drag))};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(drag>=0)move(drag,+el.dataset.i);drag=-1}})}
function move(a,b){if(b>=0&&b<bank.length&&a!==b){bank.splice(b,0,bank.splice(a,1)[0]);draw()}}
function edit(i){const q=i<0?{type:'單選題',question:'',options:['',''],correct:[0],seconds:30,image:'',explanation:''}:structuredClone(bank[i]);const d=$('#editdialog');d.innerHTML=`<form id="qform"><h2>${i<0?'新增':'編輯'}題目</h2><label>題型<select id="type">${types.map(t=>`<option ${q.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label>題目<textarea id="question" required>${esc(q.question)}</textarea></label><div id="options">${[0,1,2,3].map(n=>`<label>選項 ${letters[n]}<input id="opt${n}" value="${esc(q.options[n]||'')}"></label>`).join('')}</div><label>正確答案（排序以逗號隔開，例如 B,D,A,C）<input id="correct" value="${q.correct.map(x=>letters[x]).join(',')}" required></label><label>秒數<input id="seconds" type="number" min="5" max="180" value="${q.seconds}" required></label><label>圖片網址或路徑<input id="image" value="${esc(q.image||'')}"></label><label>或上傳圖片（PNG／JPG／WebP，自動縮小）<input id="uploadpic" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="thumb" class="pic" ${safeImage(q.image)?`src="${esc(safeImage(q.image))}"`:'hidden'}><button type="button" id="removePic">移除圖片</button><label>答案解說<textarea id="explanation">${esc(q.explanation||'')}</textarea></label><div class="tools"><button type="submit" id="commit">儲存題目</button><button type="button" id="cancel">取消</button></div></form>`;const sync=()=>{$('#options').hidden=$('#type').value==='是非題'};$('#type').onchange=sync;sync();$('#cancel').onclick=()=>d.close();const show=()=>{const u=safeImage($('#image').value);$('#thumb').hidden=!u;if(u)$('#thumb').src=u;else $('#thumb').removeAttribute('src')};$('#image').oninput=show;$('#removePic').onclick=()=>{$('#image').value='';show()};$('#uploadpic').onchange=async e=>{const f=e.target.files[0];if(!f)return;const commit=$('#commit');commit.disabled=true;try{if(f.size>15*1024*1024)throw Error('圖片不得超過 15 MB');const img=await createImageBitmap(f),scale=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);img.close();let data=c.toDataURL('image/jpeg',.7);if(data.length>400000)throw Error('圖片壓縮後仍太大，請使用較小圖片');$('#image').value=data;show()}catch(e){warn(e)}finally{commit.disabled=false}};$('#qform').onsubmit=e=>{e.preventDefault();try{const t=$('#type').value,all=[0,1,2,3].map(n=>$('#opt'+n).value.trim());if(t!=='是非題'&&all.some((x,n)=>!x&&all.slice(n+1).some(Boolean)))throw Error('選項不能跳空');const v=validate({type:t,question:$('#question').value.trim(),options:t==='是非題'?['是','非']:all.filter(Boolean),correct:$('#correct').value.toUpperCase().split(/[,，、\s]+/).filter(Boolean).map(x=>/^[ABCD]$/.test(x)?letters.indexOf(x):-1),seconds:Number($('#seconds').value),image:$('#image').value.trim(),explanation:$('#explanation').value.trim()});if(i<0)bank.push(v);else bank[i]=v;active=true;d.close();draw()}catch(e){warn(e)}};d.showModal()}
function preview(q){const d=$('#editdialog');d.innerHTML=`<h2>手機答題預覽</h2><div class="phonepreview"><p>${esc(q.type)} · ${q.seconds} 秒</p><h3>${esc(q.question)}</h3>${safeImage(q.image)?`<img class="pic" src="${esc(safeImage(q.image))}">`:''}<div class="grid">${q.options.map((x,i)=>`<button class="answer c${i}" data-choice="${i}">${['①','②','③','④'][i]} ${esc(x)}</button>`).join('')}</div><p id="feedback">請選擇答案</p><button id="retry">重試</button></div><p>正確答案：${q.correct.map(i=>esc(q.options[i])).join(' → ')}</p><p>${esc(q.explanation)}</p><button id="closepreview">關閉</button>`;let picks=[];d.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(picks.length===(q.type==='排序題'?q.options.length:1))return;let n=+b.dataset.choice;if(picks.includes(n))return;picks.push(n);$('#feedback').className=picks.length===(q.type==='排序題'?q.options.length:1)?(JSON.stringify(picks)===JSON.stringify(q.correct)?'preview-correct':'preview-wrong'):'';$('#feedback').textContent=picks.length===(q.type==='排序題'?q.options.length:1)?(JSON.stringify(picks)===JSON.stringify(q.correct)?'答對了！':'答錯了') :picks.map(i=>q.options[i]).join(' → ')});$('#retry').onclick=()=>{picks=[];$('#feedback').className='';$('#feedback').textContent='請選擇答案'};$('#closepreview').onclick=()=>d.close();d.showModal()}
draw()}

const demo=[{type:'單選題',question:'下列何者不屬於六波羅蜜？',options:['布施','持戒','祈願','精進'],correct:[2],seconds:30,explanation:'六波羅蜜為布施、持戒、忍辱、精進、禪定、般若。'},{type:'是非題',question:'六波羅蜜包含禪定。',options:['是','非'],correct:[0],seconds:15,explanation:'禪定是六波羅蜜之一。'},{type:'排序題',question:'請將數字由小到大排列。',options:['3','1','4','2'],correct:[1,3,0,2],seconds:30,explanation:'正確順序是 1、2、3、4。'},{type:'圖片辨識題',question:'圖片中的形狀為何？',options:['圓形','三角形','正方形','星形'],correct:[1],seconds:20,image:'triangle.svg',explanation:'圖片是三角形。'}];
function importBank(rows){return rows.map((r,i)=>{let type=String(r['題型']||'單選題').trim(),question=String(r['題目']||'').trim(),options=type==='是非題'?['是','非']:['A','B','C','D'].map(k=>String(r['選項'+k]??'').trim()).filter(Boolean),correct=String(r['正確答案']||'').toUpperCase().split(/[,，、\s]+/).filter(Boolean).map(x=>'ABCD'.indexOf(x)),seconds=Number(r['秒數']||30);if(!['單選題','是非題','排序題','圖片辨識題'].includes(type)||!question||options.length<2||correct.some(x=>x<0||x>=options.length)||correct.length!==(type==='排序題'?options.length:1)||new Set(correct).size!==correct.length||!Number.isInteger(seconds)||seconds<5||seconds>180)throw Error(`Excel 第 ${i+2} 列格式錯誤`);return {type,question,options,correct,seconds,image:String(r['圖片網址']||''),explanation:String(r['答案解說']||'')}})}
function template(){const rows=demo.map(q=>({'題型':q.type,'題目':q.question,'選項A':q.options[0],'選項B':q.options[1],'選項C':q.options[2]||'','選項D':q.options[3]||'','正確答案':q.correct.map(x=>'ABCD'[x]).join(','),'秒數':q.seconds,'圖片網址':q.image||'','答案解說':q.explanation}));exportX(rows,'題庫範本.xlsx')}
function exportX(rows,name){if(!window.XLSX)throw Error('Excel 元件尚未載入，請確認網路後重新整理。');const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(rows),'資料');XLSX.writeFile(w,name)}

mountEditor(document.querySelector('#app'),{demo,importBank,exportX,template,onCreate:()=>alert('此頁僅供題庫管理測試，正式開房請使用 index.html。')});

}catch(e){document.querySelector("#app").textContent="題庫載入失敗："+e.message;console.error(e)};</script></body></html>
