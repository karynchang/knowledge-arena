<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知識競技場</title><link rel="stylesheet" href="style.css?v=15.0"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="ui.js?v=15.0"></script><script src="rich-text.js?v=15.0"></script><link rel="stylesheet" href="rich-text.css?v=15.0"></head><body><header><b>✦ 知識競技場</b><div id="hostSettings" class="join-settings" hidden><label><input type="checkbox" id="lateJoin"> 允許中途加入</label><label><input type="checkbox" id="showJoinQR"> 競賽中顯示 QR Code</label></div><div id="hostHeaderActions" hidden class="tools"><button id="fullscreen">全螢幕／退出</button><button id="leaveHost">返回首頁</button></div><span id="status">連線中</span><span id="playerName" hidden></span><button hidden id="audio" aria-pressed="false" title="只控制本裝置的背景音樂與答題提示音">♫ 背景音樂／音效：關</button></header><main id="app">載入中…</main><aside id="arenaNotice" class="arena-notice" role="alert" hidden><div class="notice-message"></div><button id="arenaNoticeClose" type="button" aria-label="關閉提示">×</button></aside><dialog id="arenaConfirm" aria-labelledby="arenaConfirmTitle" aria-describedby="arenaConfirmMessage"><h2 id="arenaConfirmTitle">確認操作</h2><div id="arenaConfirmMessage" class="message-lines"></div><form method="dialog" class="competition-actions"><button value="cancel" class="confirm-cancel" autofocus>取消</button><button value="yes" id="arenaConfirmYes">確認</button></form></dialog><script type="module" src="app.js?v=15.0"></script></body></html>
